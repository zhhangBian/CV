name: Build and deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-xetex texlive-lang-chinese fonts-noto-cjk

      - name: Compile Chinese and English CVs
        run: ./make.sh

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp assets/headshot.jpg _site/headshot.jpg
          cp build/cv.pdf _site/cv.pdf
          cp build/cv_en.pdf _site/cv_en.pdf
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
