<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Zhuohang Bian's curriculum vitae">
    <title>Zhuohang Bian | Curriculum Vitae</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1f24;
        --muted: #5e6672;
        --line: #cdd3db;
        --accent: #1f4f8a;
        --accent-dark: #173c6a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: #fff;
        color: var(--ink);
        font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      }

      main {
        width: min(100%, 720px);
        display: grid;
        grid-template-columns: 112px 1fr;
        gap: 32px;
        align-items: center;
      }

      img {
        width: 112px;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        border: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 8px;
        font-weight: 650;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--accent);
        border-radius: 4px;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }

      a:first-child { background: var(--accent); color: #fff; }
      a:hover { border-color: var(--accent-dark); color: var(--accent-dark); }
      a:first-child:hover { background: var(--accent-dark); color: #fff; }

      @media (max-width: 560px) {
        main { grid-template-columns: 1fr; gap: 22px; }
        img { width: 92px; }
        a { flex: 1 1 180px; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="headshot.jpg" alt="Portrait of Zhuohang Bian">
      <div>
        <h1>Zhuohang Bian</h1>
        <p>Curriculum vitae in Chinese and English. These files are rebuilt automatically from the LaTeX source on every update.</p>
        <div class="actions">
          <a href="cv.pdf">中文简历</a>
          <a href="cv_en.pdf">English CV</a>
        </div>
      </div>
    </main>
  </body>
</html>
